  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f4f6f3',
              100: '#e7ece5',
              200: '#cfdacd',
              300: '#acc8a2',
              400: '#88a77d',
              500: '#65855a',
              600: '#4c6643',
              700: '#3a4d33',
              800: '#293624',
              900: '#1a2517',
              950: '#0f150d',
            },
            keyframes: {
              shake: {
                '0%, 100%': { transform: 'translateX(0)' },
                '25%': { transform: 'translateX(-4px)' },
                '75%': { transform: 'translateX(4px)' },
              },
              glow: {
                '0%, 100%': { filter: 'drop-shadow(0 0 2px rgba(172, 200, 162, 0.3))' },
                '50%': { filter: 'drop-shadow(0 0 10px rgba(172, 200, 162, 0.6))' },
              },
              loading: {
                '0%': { transform: 'translateX(-100%)' },
                '50%': { transform: 'translateX(100%)' },
                '100%': { transform: 'translateX(-100%)' },
              },
              marquee: {
                '0%': { transform: 'translateX(0%)' },
                '100%': { transform: 'translateX(-100%)' },
              }
            },
            animation: {
              shake: 'shake 0.5s ease-in-out infinite',
              glow: 'glow 2s ease-in-out infinite',
              loading: 'loading 1.5s ease-in-out infinite',
              marquee: 'marquee 20s linear infinite',
            }
          }
        }
      }
    }
  </script>

  <style>
    /* Custom Scrollbar for a cleaner look in main app */
    ::-webkit-scrollbar {
      width: 0;
    }

    ::-webkit-scrollbar-track {
      background: #f1f1f1;
    }

    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    /* Hide scrollbar for Preview component (Chrome, Safari and Opera) */
    .scrollbar-hide::-webkit-scrollbar {
      display: none;
    }

    /* Hide scrollbar for IE, Edge and Firefox */
    .scrollbar-hide {
      -ms-overflow-style: none;
      /* IE and Edge */
      scrollbar-width: none;
      /* Firefox */
    }

    @keyframes fade-in {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-fade-in {
      animation: fade-in 0.5s ease-out forwards;
    }

    .animate-marquee {
      animation: marquee 20s linear infinite;
    }

    @keyframes marquee {
      0% {
        transform: translateX(0%);
      }

      100% {
        transform: translateX(-100%);
      }
    }
  </style>
